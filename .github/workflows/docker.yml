name: Build and Push Docker Image(Single Job)

on:
  workflow_dispatch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/my-repo:AWS-ECS .

      - name: Push image
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/my-repo:AWS-ECS

              