name: Build and Push Docker Image

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t my-app-image:latest .

      - name: Save Docker image as tar
        run: |
          docker save my-app-image:latest -o my-app-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: my-app-image.tar


  push:
    runs-on: ubuntu-latest
    needs: build  

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          docker load -i my-app-image.tar

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag image
        run: |
          docker tag my-app-image:latest ${{ vars.DOCKERHUB_USERNAME }}/my-repo:docker_image

      - name: Push image
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/my-repo:docker_image